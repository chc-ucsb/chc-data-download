[project]
name = "chc-data-download"
version = "0.1.0"
description = "Polite, safe downloader for CHC data-service datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
download-chc-data = "download_chc_data:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["download_chc_data.py"]
